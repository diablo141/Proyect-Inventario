<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema de Gestión de Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-shell">
    <article class="login-card">
      <div class="login-brand">
        <div class="login-icon">S</div>
        <div>
          <h1>Gestión Inventario</h1>
          <p>Accede al panel administrativo</p>
        </div>
      </div>

      <form id="loginForm" class="login-form">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="admin@tienda.com" required />

        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Ingresa tu contraseña" required />

        <button type="submit" class="button-primary">Iniciar sesión</button>
        <div class="helper-text">Usuario: admin@tienda.com | Contraseña: admin123</div>
        <div id="loginMessage" class="login-message"></div>
      </form>
    </article>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
